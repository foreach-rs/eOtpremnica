name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

      # Packing on every build catches a broken package (README missing, package validation
      # failing) at the pull request instead of at the release tag.
      - run: dotnet pack src/ForEach.Infrastructure.External.eOtpremnica -c Release --no-build -o packages
